project:
  name: aviation-analytics

airports:
  - code: JFK
    name: John F. Kennedy International Airport
    latitude: 40.6413
    longitude: -73.7781

  - code: LAX
    name: Los Angeles International Airport
    latitude: 33.9416
    longitude: -118.4085

  - code: ORD
    name: O'Hare International Airport
    latitude: 41.9742
    longitude: -87.9073

  - code: ATL
    name: Hartsfield-Jackson Atlanta International Airport
    latitude: 33.6407
    longitude: -84.4277

  - code: DFW
    name: Dallas/Fort Worth International Airport
    latitude: 32.8998
    longitude: -97.0403

bts:
  default_start_month: "2023-01"
  target_end_month: "2025-12"

weather:
  default_start_date: "2023-01-01"
  target_end_date: "2025-12-31"

  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - rain
    - snowfall
    - weather_code
    - pressure_msl
    - cloud_cover
    - wind_speed_10m
    - wind_direction_10m
    - wind_gusts_10m