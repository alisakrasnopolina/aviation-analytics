metrics:
- metric_id: total_flights
  name: Суточное число рейсов
  dataset_id: gold_daily
  formula: COUNT(*) по origin_airport_id, flight_date в silver.flights
  unit: рейсы
  source_fields:
  - BTS FlightDate
  - BTS Origin
  - silver.flights.flight_id
  limitations: Включает отменённые и перенаправленные; только рейсы, представленные
    в BTS.
- metric_id: delay_share
  name: Доля задержек вылета ≥15 минут
  dataset_id: gold_daily
  formula: 100.0 * delayed_flights / completed_flights; completed=не отменён; delayed=не
    отменён и dep_delay_minutes>=15
  unit: проценты (0–100)
  source_fields:
  - BTS Cancelled
  - BTS DepDelayMinutes
  - BTS FlightDate
  - BTS Origin
  limitations: При completed=0 доля не определена; контроль качества блокирует прогноз.
    В Gold SQL сейчас подставляет 0.
- metric_id: forecast_delay_share
  name: Прогноз доли задержек
  dataset_id: bi_next
  formula: CatBoost по лагам целей/отмен, исторической погоде и календарю; selected_for_use=True
  unit: проценты (0–100)
  source_fields:
  - gold.airport_daily
  - saved full_history model
  - experiment chosen_model_by_validation
  limitations: Горизонт 1 день; история до t-1; BTS публикуется с задержкой; тестовые
    метрики относятся к исходной evaluation-модели.
